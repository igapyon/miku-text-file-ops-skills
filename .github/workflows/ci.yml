name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}

      - name: Validate scaffold or build and test
        shell: bash
        run: |
          set -euo pipefail
          if node -e "process.exit(require('./package.json').scripts?.build ? 0 : 1)"; then
            npm run build
          elif [[ -d skills ]]; then
            echo "package.json must define scripts.build before skills/ is added." >&2
            exit 1
          else
            node -e "
              const packageJson = require('./package.json');
              if (packageJson.name !== 'miku-text-file-ops-skills') {
                throw new Error('unexpected package name');
              }
              if (packageJson.private !== true) {
                throw new Error('the orchestration package must remain private');
              }
              if (packageJson.engines?.node !== '>=22') {
                throw new Error('engines.node must remain aligned with the Node.js 22 minimum');
              }
              console.log('Repository scaffold is valid; full build starts when scripts.build is added.');
            "
          fi
